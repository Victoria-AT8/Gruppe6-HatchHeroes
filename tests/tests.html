<!DOCTYPE html>
<!-- Owner: Erol – automatische Tests (PROJEKTPLAN.md, Abschnitt 10). Einfach im Browser öffnen. -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>HatchHeroes – Tests</title>
</head>
<body>
  <h1>HatchHeroes – Tests</h1>
  <p id="summary">Tests laufen …</p>
  <!-- Die Speicher-Tests brauchen den Projektordner, weil sie in test-data.json und test-battles.json schreiben -->
  <p id="storage-note"></p>
  <button id="storage-button" hidden>📂 Testordner wählen</button>
  <ul id="results"></ul>

  <!-- Nur die Logik-Dateien laden, keine Screens und kein main.js -->
  <script src="../js/storage.js"></script>
  <script src="../js/pet.js"></script>
  <script src="../js/evolution.js"></script>
  <script src="../js/battle.js"></script>

  <script>
    // Tests speichern in eigene Dateien, damit der echte Spielstand (data.json, battles.json) unberührt bleibt.
    dataFileName = "test-data.json";
    battlesFileName = "test-battles.json";

    let passed = 0;
    let failed = 0;

    // Schreibt eine Zeile in die Ergebnisliste.
    function showResult(ok, text) {
      const line = document.createElement("li");
      line.textContent = (ok ? "✔ " : "✘ ") + text;
      line.style.color = ok ? "green" : "red";
      document.getElementById("results").appendChild(line);
    }

    // Vergleicht actual (was die Funktion liefert) mit expected (was herauskommen soll).
    // Beide werden zuerst in Text umgewandelt, damit auch Objekte und Listen verglichen werden können.
    function check(name, actual, expected) {
      const actualText = String(JSON.stringify(actual));
      const expectedText = String(JSON.stringify(expected));

      if (actualText === expectedText) {
        passed = passed + 1;
        showResult(true, name);
      } else {
        failed = failed + 1;
        showResult(false, name + " – erwartet: " + expectedText + ", bekommen: " + actualText);
      }
    }

    // Wenn eine Testdatei abstürzt, wird der Fehler hier angezeigt statt nur in der Konsole.
    window.addEventListener("error", function (event) {
      failed = failed + 1;
      const file = event.filename.split("/").pop();
      showResult(false, "Fehler in " + file + ", Zeile " + event.lineno + ": " + event.message);
    });
  </script>

  <script src="test-pet.js"></script>
  <script src="test-evolution.js"></script>
  <script src="test-battle.js"></script>

  <script>
    // true, sobald die Speicher-Tests gelaufen sind.
    let storageTestsDone = false;

    // Zusammenfassung oben auf der Seite.
    // Grün nur, wenn alles bestanden ist UND die Speicher-Tests schon gelaufen sind.
    function showSummary() {
      const summary = document.getElementById("summary");
      let text = passed + " von " + (passed + failed) + " Tests bestanden.";
      if (!storageTestsDone) {
        text = text + " Die Speicher-Tests fehlen noch.";
      }
      summary.textContent = text;
      if (failed > 0) {
        summary.style.color = "red";
      } else if (storageTestsDone) {
        summary.style.color = "green";
      } else {
        summary.style.color = "black";
      }
    }

    // FR2.1, DH1–DH13, NFR2.1: Speicher-Tests mit den echten Dateien test-data.json und test-battles.json.
    // Sie brauchen den Projektordner (wie das Spiel). Hat Chrome den Zugriff schon erlaubt,
    // laufen sie sofort. Sonst erst nach einem Klick auf "Testordner wählen".
    // askUser: wie bei openDataFolder() in storage.js.
    async function startStorageTests(askUser) {
      const note = document.getElementById("storage-note");
      const button = document.getElementById("storage-button");

      if (!canUseDataFile()) {
        note.textContent = "Die Speicher-Tests laufen nur in Chrome oder Edge.";
        return;
      }

      button.hidden = true;
      note.textContent = "Speicher-Tests laufen …";
      try {
        const opened = await openDataFolder(askUser);
        if (!opened) {
          note.textContent = "Für die Speicher-Tests bitte den Projektordner wählen. " +
            "Die Tests schreiben nur in test-data.json und test-battles.json, nie in data.json oder battles.json.";
          button.hidden = false;
          return;
        }
        await runStorageTests();   // steht in test-evolution.js
        storageTestsDone = true;
        note.textContent = "Speicher-Tests fertig.";
      } catch (error) {
        // Fehler in async-Funktionen landen nicht beim "error"-Event oben, deshalb hier.
        failed = failed + 1;
        showResult(false, "Fehler in den Speicher-Tests: " + error.message);
        note.textContent = "Die Speicher-Tests sind abgebrochen.";
        button.hidden = false;
      }
      showSummary();
    }

    // Zuerst laufen alle Tests ohne Datei (oben), dann die Speicher-Tests.
    showSummary();
    document.getElementById("storage-button").addEventListener("click", function () {
      startStorageTests(true);
    });
    startStorageTests(false);
  </script>
</body>
</html>
